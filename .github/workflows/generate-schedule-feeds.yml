name: Generate schedule calendar feeds

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}
  push:
    paths:
      - 'scripts/generate_ics.py'
      - '.github/workflows/generate-schedule-feeds.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate .ics feeds from the schedule
        run: python3 scripts/generate_ics.py

      - name: Commit updated feeds if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/
          if git diff --cached --quiet; then
            echo "No schedule changes, nothing to commit."
            exit 0
          fi
          git commit -m "Auto-update schedule calendar feeds"
          # Another commit can land on main between our checkout and our push,
          # which makes the push non-fast-forward and fails the whole run even
          # though the feeds generated fine. Rebase onto whatever is on main
          # now and retry a few times instead of giving up.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt, rebasing onto latest main..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 3))
          done
          echo "Could not push updated feeds after 5 attempts." >&2
          exit 1
